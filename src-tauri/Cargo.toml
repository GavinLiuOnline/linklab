[package]
name = "linklab"
version = "0.1.0"
edition = "2021"
description = "LinkLab 通讯调试台 — 串口 / CAN / 网络 / MQTT 跨平台调试工具"

[lib]
name = "linklab_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time"] }
serialport = "4"
rumqttc = "0.24"

[target.'cfg(target_os = "linux")'.dependencies]
socketcan = "3"

[profile.release]
strip = true
lto = true
codegen-units = 1
opt-level = "s"
panic = "abort"
